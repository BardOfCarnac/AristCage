<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Optical card backing proof</title>
  <link rel="stylesheet" href="../../css/entries.css">
  <link rel="stylesheet" href="../../css/optical-projection.css">
  <link rel="stylesheet" href="../../css/optical-three-plane-profile.css">
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: rgb(36, 132, 224);
    }

    body {
      min-height: 650px;
    }

    .proof-card {
      position: absolute;
    }

    .proof-card[data-proof-state="compact"] {
      left: 70px;
      top: 70px;
      width: 320px;
      height: 140px;
    }

    .proof-card[data-proof-state="expanded"] {
      left: 190px;
      top: 290px;
      width: 520px;
      height: 280px;
    }

    .proof-card > .optical-semantic-item {
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }

    .proof-card .corner {
      color: rgb(255, 70, 40);
    }
  </style>
</head>
<body class="optical-mode">
  <div class="proof-card" data-proof-state="compact">
    <div class="optical-semantic-item" data-optical-role="plate">
      <div class="optical-plate-surface"></div>
    </div>
    <div class="optical-semantic-item" data-optical-role="frame">
      <div class="frame"></div>
    </div>
    <div class="optical-semantic-item" data-optical-role="corners">
      <div class="corners">
        <i class="corner corner-tl"></i>
        <i class="corner corner-tr"></i>
        <i class="corner corner-bl"></i>
        <i class="corner corner-br"></i>
      </div>
    </div>
  </div>

  <div class="proof-card" data-proof-state="expanded">
    <div class="optical-semantic-item" data-optical-role="plate">
      <div class="optical-plate-surface"></div>
    </div>
    <div class="optical-semantic-item" data-optical-role="frame">
      <div class="frame"></div>
    </div>
    <div class="optical-semantic-item" data-optical-role="corners">
      <div class="corners">
        <i class="corner corner-tl"></i>
        <i class="corner corner-tr"></i>
        <i class="corner corner-bl"></i>
        <i class="corner corner-br"></i>
      </div>
    </div>
  </div>
</body>
</html>
