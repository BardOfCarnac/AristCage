name: Apply localised heavy mist bank

on:
  pull_request:
    paths:
      - ".github/workflows/redwire-weather-card-occlusion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localise-bank:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/heavy-mist-foreground-surge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Stage one leading real mist bank
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("departments/weather/weather-module.js")
          text = path.read_text()
          old = '''    function primeHeavyMistBank(bounds) {
      if (!state.heavyMistPrimePending || state.targetPreset !== HEAVY_MIST_PRESET) return 0;
      const bank = particles.mist.find(item => item.active);
      if (!bank) return 0;
      resetMistBank(bank, bounds, true);
      bank.x = 0;
      bank.z = clamp(HEAVY_MIST_FOREGROUND_DEPTH - 0.22, bounds.near + 0.18, bounds.far - 0.25);
      bank.width = 1.72;
      bank.depth = 0.82;
      bank.lift = 0.18;
      bank.verticalSeed = 0.72;
      bank.scaleSeed = 1;
      bank.alpha = 0.95;
      bank.puffs = 4;
      bank.bias = 0.04;
      bank.speed = 0.92;
      state.heavyMistPrimePending = false;
      state.heavyMistPrimeCount += 1;
      return 1;
    }
'''
          new = '''    function primeHeavyMistBank(bounds) {
      if (!state.heavyMistPrimePending || state.targetPreset !== HEAVY_MIST_PRESET) return 0;
      const activeBanks = particles.mist.filter(item => item.active);
      const bank = activeBanks[0];
      if (!bank) return 0;

      activeBanks.slice(1).forEach(item => {
        if (item.z < HEAVY_MIST_FOREGROUND_DEPTH + 0.45) {
          item.z = randomBetween(
            Math.min(bounds.far - 0.3, HEAVY_MIST_FOREGROUND_DEPTH + 0.65),
            bounds.far - 0.25
          );
        }
      });

      resetMistBank(bank, bounds, true);
      bank.x = 0;
      bank.z = clamp(HEAVY_MIST_FOREGROUND_DEPTH - 0.38, bounds.near + 0.18, bounds.far - 0.25);
      bank.width = 0.84;
      bank.depth = 0.46;
      bank.lift = 0.16;
      bank.verticalSeed = 0.48;
      bank.scaleSeed = 0.82;
      bank.alpha = 0.78;
      bank.puffs = 3;
      bank.bias = 0.03;
      bank.speed = 0.88;
      state.heavyMistPrimePending = false;
      state.heavyMistPrimeCount += 1;
      return 1;
    }
'''
          if new not in text:
              if old not in text:
                  raise SystemExit("Missing canonical heavy-mist bank anchor")
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate localised bank
        run: |
          node --check departments/weather/weather-module.js
          node departments/weather/tests/weather-module.node.test.js
      - name: Commit localised bank
        run: |
          if git diff --quiet -- departments/weather/weather-module.js; then
            echo "Localised bank already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add departments/weather/weather-module.js
          git commit -m "Localise the leading heavy-mist bank"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
