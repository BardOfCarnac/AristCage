name: Apply canonical heavy mist

on:
  pull_request:
    paths:
      - ".github/workflows/redwire-weather-card-occlusion.yml"
      - "departments/weather/weather-module.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-canonical-weather:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/heavy-mist-foreground-surge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Move heavy mist into the accepted Weather module
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("departments/weather/weather-module.js")
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Missing anchor: {label}")
              text = text.replace(old, new, 1)

          replace_once(
              '  const DEPTH_CONVENTION = "smaller-positive-z-is-nearer";\n',
              '  const DEPTH_CONVENTION = "smaller-positive-z-is-nearer";\n'
              '  const HEAVY_MIST_PRESET = "heavy-mist";\n'
              '  const HEAVY_MIST_FOREGROUND_DEPTH = 5.45;\n'
              '  const MIST_PRESET_DEPTH_BASELINE = Number(PRESETS.mist?.depthFlow) || 0;\n',
              'Weather depth constants'
          )
          replace_once(
              '      fpsUpdates: 0,\n      depthFrameSerial: 0\n',
              '      fpsUpdates: 0,\n'
              '      depthFrameSerial: 0,\n'
              '      heavyMistPrimePending: false,\n'
              '      heavyMistPrimeCount: 0\n',
              'Weather state'
          )
          replace_once(
              '    function resetMistBank(bank, bounds, initial = false) {\n',
              '    function effectiveMistDepthFlow() {\n'
              '      const configured = Number(state.config.depthFlow) || 0;\n'
              '      const presetAdjustment = state.config.mist > 0\n'
              '        ? configured - MIST_PRESET_DEPTH_BASELINE\n'
              '        : configured;\n'
              '      return APPROVED_MIST.depthFlow + presetAdjustment + state.wind.z;\n'
              '    }\n\n'
              '    function effectiveParticleDepthFlow() {\n'
              '      return (Number(state.config.depthFlow) || 0) + state.wind.z;\n'
              '    }\n\n'
              '    function resetMistBank(bank, bounds, initial = false) {\n',
              'effective Weather depth policy'
          )
          replace_once(
              '        const depthFlow = APPROVED_MIST.depthFlow + state.wind.z;\n',
              '        const depthFlow = effectiveMistDepthFlow();\n',
              'mist respawn depth flow'
          )
          replace_once(
              '        const particle = { active: false, type };\n',
              '        const particle = { active: false, type, slot: pool.length };\n',
              'stable particle slot'
          )
          replace_once(
              '        depthFlow: APPROVED_MIST.depthFlow + state.wind.z,\n',
              '        depthFlow: effectiveMistDepthFlow(),\n',
              'mist settings depth flow'
          )
          text = text.replace(
              '(state.wind.z + state.config.depthFlow) * 0.26',
              'effectiveParticleDepthFlow() * 0.26'
          )
          text = text.replace(
              '(state.wind.z + state.config.depthFlow) * 0.20',
              'effectiveParticleDepthFlow() * 0.20'
          )
          replace_once(
              '    function updateParticle(particle, deltaSeconds, bounds) {\n',
              '    function primeHeavyMistBank(bounds) {\n'
              '      if (!state.heavyMistPrimePending || state.targetPreset !== HEAVY_MIST_PRESET) return 0;\n'
              '      const bank = particles.mist.find(item => item.active);\n'
              '      if (!bank) return 0;\n'
              '      resetMistBank(bank, bounds, true);\n'
              '      bank.x = 0;\n'
              '      bank.z = clamp(HEAVY_MIST_FOREGROUND_DEPTH - 0.22, bounds.near + 0.18, bounds.far - 0.25);\n'
              '      bank.width = 1.72;\n'
              '      bank.depth = 0.82;\n'
              '      bank.lift = 0.18;\n'
              '      bank.verticalSeed = 0.72;\n'
              '      bank.scaleSeed = 1;\n'
              '      bank.alpha = 0.95;\n'
              '      bank.puffs = 4;\n'
              '      bank.bias = 0.04;\n'
              '      bank.speed = 0.92;\n'
              '      state.heavyMistPrimePending = false;\n'
              '      state.heavyMistPrimeCount += 1;\n'
              '      return 1;\n'
              '    }\n\n'
              '    function updateParticle(particle, deltaSeconds, bounds) {\n',
              'canonical near bank'
          )
          replace_once(
              '      TYPES.forEach(type => deactivateSurplus(type, counts[type]));\n      particles.mist.forEach(bank => updateMistBank(bank, deltaSeconds, scene.bounds, settings));\n',
              '      TYPES.forEach(type => deactivateSurplus(type, counts[type]));\n'
              '      primeHeavyMistBank(scene.bounds);\n'
              '      particles.mist.forEach(bank => updateMistBank(bank, deltaSeconds, scene.bounds, settings));\n',
              'prime heavy bank during runtime'
          )
          replace_once(
              '      state.config = selected.values;\n      state.transition = null;\n      if (state.initialised && state.enabled && !state.suspended) runtimeHandle?.wake?.("weather:preset");\n',
              '      state.config = selected.values;\n'
              '      state.transition = null;\n'
              '      state.heavyMistPrimePending = selected.key === HEAVY_MIST_PRESET;\n'
              '      if (state.initialised && state.enabled && !state.suspended) runtimeHandle?.wake?.("weather:preset");\n',
              'setPreset heavy prime'
          )
          replace_once(
              '      state.targetPreset = selected.key;\n      if (!duration) return setPreset(selected.key);\n',
              '      state.targetPreset = selected.key;\n'
              '      state.heavyMistPrimePending = selected.key === HEAVY_MIST_PRESET;\n'
              '      if (!duration) return setPreset(selected.key);\n',
              'transition heavy prime'
          )
          replace_once(
              '      state.config = clonePreset(PRESETS.clear);\n      state.transition = null;\n      state.currentIntensity = 0;\n',
              '      state.config = clonePreset(PRESETS.clear);\n'
              '      state.transition = null;\n'
              '      state.heavyMistPrimePending = false;\n'
              '      state.currentIntensity = 0;\n',
              'clear heavy prime'
          )
          replace_once(
              '      particles.mist.forEach(bank => resetMistBank(bank, bounds, true));\n      deactivateAll(false);\n',
              '      particles.mist.forEach(bank => resetMistBank(bank, bounds, true));\n'
              '      state.heavyMistPrimePending = state.targetPreset === HEAVY_MIST_PRESET;\n'
              '      deactivateAll(false);\n',
              'seed heavy prime'
          )
          replace_once(
              '        depthConvention: DEPTH_CONVENTION,\n        puffCount: puffs.length,\n',
              '        depthConvention: DEPTH_CONVENTION,\n'
              '        mistDepthFlow: effectiveMistDepthFlow(),\n'
              '        particleDepthFlow: effectiveParticleDepthFlow(),\n'
              '        puffCount: puffs.length,\n',
              'depth frame flow diagnostics'
          )
          replace_once(
              '          approvedMist: APPROVED_MIST,\n          depthFrame: Object.freeze({\n',
              '          approvedMist: APPROVED_MIST,\n'
              '          effectiveDepthFlow: Object.freeze({\n'
              '            configured: Number(state.config.depthFlow) || 0,\n'
              '            wind: state.wind.z,\n'
              '            mist: effectiveMistDepthFlow(),\n'
              '            particles: effectiveParticleDepthFlow(),\n'
              '            heavyMistPrimeCount: state.heavyMistPrimeCount\n'
              '          }),\n'
              '          depthFrame: Object.freeze({\n',
              'snapshot flow diagnostics'
          )

          path.write_text(text)
          PY
      - name: Validate canonical Weather source
        run: |
          node --check departments/weather/weather-module.js
          node departments/weather/tests/weather-module.node.test.js
      - name: Commit canonical Weather implementation
        run: |
          if git diff --quiet -- departments/weather/weather-module.js; then
            echo "Canonical Weather implementation already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add departments/weather/weather-module.js
          git commit -m "Move heavy mist into canonical Weather module"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
