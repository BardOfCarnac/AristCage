name: Export particle rebuild source

on:
  push:
    branches:
      - agent/particle-rebuild-source-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: particle-rebuild-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
