name: Chamber Presentation Restoration

on:
  pull_request:
    paths:
      - "index.html"
      - "js/weather-frame-bridge.js"
      - "js/chamber-motion-presentation.js"
      - "tests/weather-frame-bridge.test.js"
      - "tests/chamber-motion-presentation.test.js"
      - "tests/chamber-motion-presentation-init-race.test.js"
      - "tests/chamber-motion-presentation-render.mjs"
      - "docs/CHAMBER-PRESENTATION-RESTORATION.md"
      - ".github/workflows/chamber-presentation-restoration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check restoration syntax
        run: |
          node --check js/weather-frame-bridge.js
          node --check js/chamber-motion-presentation.js
          node --check tests/weather-frame-bridge.test.js
          node --check tests/chamber-motion-presentation.test.js
          node --check tests/chamber-motion-presentation-init-race.test.js
          node --check tests/chamber-motion-presentation-render.mjs
      - name: Run synchronized Weather bridge contract
        run: node tests/weather-frame-bridge.test.js
      - name: Run deterministic exact-depth presentation harness
        run: node tests/chamber-motion-presentation.test.js
      - name: Preserve destroy during readiness
        run: node tests/chamber-motion-presentation-init-race.test.js
      - name: Check page load order
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const weather = html.indexOf('departments/weather/weather-module.js');
          const bridge = html.indexOf('js/weather-frame-bridge.js');
          const integration = html.indexOf('js/integration-departments.js');
          const activity = html.indexOf('js/chamber-motion-activity.js');
          const presentation = html.indexOf('js/chamber-motion-presentation.js');
          const probe = html.indexOf('js/integration-browser-probe.js');
          if (weather < 0 || bridge < weather || integration < bridge || activity < integration || presentation < activity || probe < presentation) {
            throw new Error('Weather frame bridge and chamber presentation load order is invalid.');
          }
          for (const path of ['js/weather-frame-bridge.js', 'js/chamber-motion-presentation.js']) {
            if ((html.match(new RegExp(path.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) || []).length !== 1) {
              throw new Error(`${path} must be loaded exactly once.`);
            }
          }
          console.log('Synchronized Weather/chamber load order is correct.');
          NODE

  rendered-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Verify exact-depth desktop and mobile composition
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -m http.server 4173 > /tmp/ncn-chamber-presentation-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/chamber-motion-presentation-render.mjs
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chamber-presentation-exact-depth
          path: artifacts/
          if-no-files-found: ignore
