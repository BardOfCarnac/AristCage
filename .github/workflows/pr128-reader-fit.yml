name: PR128 Reader Fit Correction

on:
  pull_request:
    paths:
      - ".github/workflows/pr128-reader-fit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/dripfeed-shared-article-bands'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply owner-correct reader fitting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              source = Path(path).read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              Path(path).write_text(source.replace(old, new, 1))

          replace_once('js/dripfeed-chamber-integration.js', """  function setPx(element, property, value) {
    element?.style?.setProperty?.(property, `${Math.round(finite(value) * 100) / 100}px`);
  }

  function cameraSnapshot() {
""", """  function setPx(element, property, value) {
    element?.style?.setProperty?.(property, `${Math.round(finite(value) * 100) / 100}px`);
  }

  function readerTarget(publication = readyPublication) {
    return publication?.readingSurface?.closest?.('[data-reader-target]') || null;
  }

  function releaseReaderPlacement(publication = readyPublication) {
    const target = readerTarget(publication);
    if (!target?.style) return false;
    target.style.removeProperty?.('width');
    target.style.removeProperty?.('max-height');
    target.style.removeProperty?.('transform-origin');
    delete target.dataset.chamberReaderFit;
    delete target.dataset.chamberReaderLayoutWidth;
    delete target.dataset.chamberReaderMaxHeight;
    return true;
  }

  function stylePixels(styles, property) {
    const value = styles?.getPropertyValue?.(property) || styles?.[property] || 0;
    return Math.max(0, finite(parseFloat(value)));
  }

  function fitReaderPlacement(publication, scale) {
    const target = readerTarget(publication);
    const overlay = target?.closest?.('.reader-overlay') || target?.parentElement || null;
    if (!target?.style || !overlay) return false;

    releaseReaderPlacement(publication);

    let overlayStyles = null;
    try { overlayStyles = getComputedStyle(overlay); } catch (error) {}
    const contentWidth = Math.max(1,
      finite(overlay.clientWidth, window.innerWidth)
      - stylePixels(overlayStyles, 'padding-left')
      - stylePixels(overlayStyles, 'padding-right'));
    const contentHeight = Math.max(1,
      finite(overlay.clientHeight, window.innerHeight - currentRailBottom())
      - stylePixels(overlayStyles, 'padding-top')
      - stylePixels(overlayStyles, 'padding-bottom'));
    const safeScale = Math.max(0.0001, finite(scale, 1));
    const naturalWidth = Math.max(1,
      finite(target.offsetWidth, finite(target.getBoundingClientRect?.().width) / safeScale));
    const visualWidth = Math.min(naturalWidth, contentWidth);
    const layoutWidth = visualWidth / safeScale;
    const layoutMaxHeight = contentHeight / safeScale;

    target.style.setProperty('width', `${layoutWidth}px`);
    target.style.setProperty('max-height', `${layoutMaxHeight}px`);
    target.style.setProperty('transform-origin', '50% 0');
    target.dataset.chamberReaderFit = 'contained';
    target.dataset.chamberReaderLayoutWidth = layoutWidth.toFixed(3);
    target.dataset.chamberReaderMaxHeight = layoutMaxHeight.toFixed(3);
    return true;
  }

  function cameraSnapshot() {
""")

          replace_once('js/dripfeed-chamber-integration.js', """    // The reader is already laid out inside the rail-safe overlay. Scale it from
    // its top edge so the close control cannot be enlarged underneath the shared
    // title rail, and do not translate that interactive surface into rail space.
    setPx(element, '--drip-reader-x', 0);
    setPx(element, '--drip-reader-y', 0);
    element.style.setProperty('--drip-reader-scale', reader.scale.toFixed(6));
    const readerTarget = readyPublication?.readingSurface?.closest?.('[data-reader-target]');
    if (readerTarget?.style) readerTarget.style.transformOrigin = '50% 0';
""", """    // The overlay already centres the reader. Keep translation at zero and
    // inversely fit its layout box before applying the foreground scale, so the
    // transformed card and controls remain inside the rail-safe viewport.
    setPx(element, '--drip-reader-x', 0);
    setPx(element, '--drip-reader-y', 0);
    element.style.setProperty('--drip-reader-scale', reader.scale.toFixed(6));
    fitReaderPlacement(readyPublication, reader.scale);
""")

          replace_once('js/dripfeed-chamber-integration.js', """      case 'dripfeed:close-transmission':
        if (readyPublication?.token !== detail.token) break;
        readyPublication = null;
""", """      case 'dripfeed:close-transmission':
        if (readyPublication?.token !== detail.token) break;
        releaseReaderPlacement(readyPublication);
        readyPublication = null;
""")

          replace_once('js/dripfeed-chamber-integration.js', """    unbindRootEvents();
    pendingOpen = null;
    readyPublication = null;
""", """    unbindRootEvents();
    pendingOpen = null;
    releaseReaderPlacement(readyPublication);
    readyPublication = null;
""")

          replace_once('tests/dripfeed-chamber-integration.mjs', """  const reading = await page.evaluate(() => {
    const surfaces = window.NCNDripfeed.getSpatialSurfaces();
    const target = document.querySelector('#dripfeed-root [data-reader-target]');
    const reader = surfaces.reading;
    const transform = getComputedStyle(target).transform;
    const matrix = transform && transform !== 'none' ? new DOMMatrixReadOnly(transform) : null;
    return {
      connected: Boolean(reader?.isConnected),
      surface: reader?.dataset.spatialSurface || null,
      targetTransform: transform,
      targetScale: matrix?.a || 1
    };
  });
  assert(reading.connected, `${name}: ready publication has no connected reader.`);
  assert(reading.surface === 'reading', `${name}: reader is not published through the spatial contract.`);
  assert(reading.targetTransform !== 'none', `${name}: reader plane has no rendered camera transform.`);
  assert(reading.targetScale > 1, `${name}: reader did not resolve forward of the chamber grid.`);
  assert(near(reading.targetScale, planes.reader.scale, 0.04), `${name}: reader transform does not match camera projection.`);
""", """  const reading = await page.evaluate(() => {
    const surfaces = window.NCNDripfeed.getSpatialSurfaces();
    const target = document.querySelector('#dripfeed-root [data-reader-target]');
    const overlay = target?.closest('.reader-overlay');
    const close = target?.querySelector('.icon-close');
    const rail = document.querySelector('.rail');
    const reader = surfaces.reading;
    const transform = getComputedStyle(target).transform;
    const matrix = transform && transform !== 'none' ? new DOMMatrixReadOnly(transform) : null;
    const rect = element => {
      const box = element?.getBoundingClientRect?.();
      return box ? {
        left: box.left, top: box.top, right: box.right, bottom: box.bottom,
        width: box.width, height: box.height
      } : null;
    };
    return {
      connected: Boolean(reader?.isConnected),
      surface: reader?.dataset.spatialSurface || null,
      targetTransform: transform,
      targetScale: matrix?.a || 1,
      fit: target?.dataset.chamberReaderFit || null,
      layoutWidth: parseFloat(target?.dataset.chamberReaderLayoutWidth || '0'),
      layoutMaxHeight: parseFloat(target?.dataset.chamberReaderMaxHeight || '0'),
      target: rect(target),
      overlay: rect(overlay),
      close: rect(close),
      rail: rect(rail),
      viewport: { width: innerWidth, height: innerHeight },
      clientHeight: target?.clientHeight || 0,
      scrollHeight: target?.scrollHeight || 0
    };
  });
  assert(reading.connected, `${name}: ready publication has no connected reader.`);
  assert(reading.surface === 'reading', `${name}: reader is not published through the spatial contract.`);
  assert(reading.targetTransform !== 'none', `${name}: reader plane has no rendered camera transform.`);
  assert(reading.targetScale > 1, `${name}: reader did not resolve forward of the chamber grid.`);
  assert(near(reading.targetScale, planes.reader.scale, 0.04), `${name}: reader transform does not match camera projection.`);
  assert(reading.fit === 'contained', `${name}: reader layout was not inversely fitted before scaling.`);
  assert(reading.layoutWidth > 0 && reading.layoutMaxHeight > 0,
    `${name}: reader fit did not publish positive layout limits.`);
  assert(reading.target.left >= reading.overlay.left - 1 && reading.target.right <= reading.overlay.right + 1,
    `${name}: scaled reader escapes the overlay horizontally (${reading.target.left}..${reading.target.right} vs ${reading.overlay.left}..${reading.overlay.right}).`);
  assert(reading.target.top >= reading.overlay.top - 1 && reading.target.bottom <= reading.overlay.bottom + 1,
    `${name}: scaled reader escapes the overlay vertically (${reading.target.top}..${reading.target.bottom} vs ${reading.overlay.top}..${reading.overlay.bottom}).`);
  assert(Math.abs((reading.target.left + reading.target.right) - (reading.overlay.left + reading.overlay.right)) <= 2,
    `${name}: scaled reader is not centred in the overlay.`);
  assert(reading.close.left >= 0 && reading.close.right <= reading.viewport.width + 1,
    `${name}: reader close control is clipped horizontally.`);
  assert(reading.close.top >= reading.rail.bottom - 1 && reading.close.bottom <= reading.viewport.height + 1,
    `${name}: reader close control is hidden by the rail or viewport.`);
""")

          replace_once('tests/dripfeed-fixed-band-contract.test.js', """  "setPx(element, '--drip-reader-x', 0)",
  "setPx(element, '--drip-reader-y', 0)",
