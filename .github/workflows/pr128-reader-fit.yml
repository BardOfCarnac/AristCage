          rm .github/workflows/pr128-reader-fit.yml
          git config user.name "AristCage Integration"
          git config user.email "integration@aristcage.invalid"
          git add js/dripfeed-chamber-integration.js tests/dripfeed-chamber-integration.mjs tests/dripfeed-fixed-band-contract.test.js docs/DRIPFEED-CHAMBER-INTEGRATION.md .github/workflows/pr128-reader-fit.yml
          git commit -m "Contain the scaled Dripfeed reader in its overlay"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
