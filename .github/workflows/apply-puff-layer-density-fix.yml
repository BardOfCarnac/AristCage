name: Apply Exact Puff Layer And Density Fix

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/agent/article-mist-descent') || (github.event_name == 'pull_request' && github.head_ref == 'agent/article-mist-descent') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/article-mist-descent
      - id: ready
        run: |
          if [ -f scripts/apply-puff-layer-density-fix.cjs ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - name: Apply exact puff layer and density correction
        if: steps.ready.outputs.ready == 'true'
        run: node scripts/apply-puff-layer-density-fix.cjs
      - name: Commit production correction
        if: steps.ready.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add departments/weather/weather-presets.js departments/weather/weather-module.js departments/weather/tests/weather-module.node.test.js departments/weather/tests/weather-mist-visual-contract.test.js
          git commit -m "Assign mist layers by exact puff depth and densify light mist [puff-layer-fix]"
          git push origin HEAD:agent/article-mist-descent
