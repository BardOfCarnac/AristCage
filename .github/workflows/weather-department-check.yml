name: Temporary canonical particle publisher

on:
  push:
    branches:
      - agent/particle-rebuild-source-export

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild particle branch from current main
        run: |
          set -euo pipefail
          cat .particle-rebuild/part-*.b64 | base64 -d > /tmp/canonical-particles.patch
          git fetch origin main
          git checkout --detach origin/main
          git apply --check /tmp/canonical-particles.patch
          git apply /tmp/canonical-particles.patch
          node --check departments/weather/weather-particles.js
          node --check departments/weather/weather-module.js
          node departments/weather/tests/weather-module.node.test.js
          node departments/weather/tests/weather-particles-canonical.node.test.js
          node departments/weather/tests/weather-mist-visual-contract.test.js
          node tests/heavy-mist-weather-policy.test.js
          node tests/weather-after-render-contract.test.js
          node tests/redwire-weather-card-occlusion.test.js
          node tests/environment-profile-contract.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/chamber-presentation-restoration.yml \
            .github/workflows/integration-host-check.yml \
            .github/workflows/redwire-weather-card-occlusion.yml \
            .github/workflows/weather-department-check.yml \
            .github/workflows/weather-particle-field.yml \
            departments/weather/tests/weather-module.node.test.js \
            departments/weather/tests/weather-module.test.js \
            departments/weather/tests/weather-particles-canonical.node.test.js \
            departments/weather/tests/weather-pr86-host.test.js \
            departments/weather/weather-manifest.js \
            departments/weather/weather-module.js \
            departments/weather/weather-particles.js \
            index.html js/integration-harness.js \
            tests/weather-after-render-contract.test.js \
            tests/weather-particles-render.mjs
          git commit -m "Integrate depth-aware particles into canonical Weather"
          git push origin HEAD:agent/depth-aware-weather-particles --force
