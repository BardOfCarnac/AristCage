name: Weather Department Checks

on:
  pull_request:
    paths:
      - "departments/weather/**"
      - ".github/workflows/weather-department-check.yml"
  push:
    branches:
      - agent/prepare-module-host
    paths:
      - "departments/weather/**"
      - ".github/workflows/weather-department-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  departmental-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Weather publication JavaScript syntax
        run: |
          set -euo pipefail
          files=(
            departments/weather/weather-manifest.js
            departments/weather/weather-presets.js
            departments/weather/weather-module.js
            departments/weather/tests/weather-module.node.test.js
            departments/weather/tests/weather-module.test.js
            departments/weather/tests/weather-pr86-host.test.js
          )
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Run deterministic Weather acceptance harness
        run: node departments/weather/tests/weather-module.node.test.js

      - name: Check PR-86 ownership boundaries
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('departments/weather/weather-module.js', 'utf8');
          const css = fs.readFileSync('departments/weather/weather-module.css', 'utf8');
          const manifest = fs.readFileSync('departments/weather/weather-manifest.js', 'utf8');
          for (const token of [
            'context.layers?.weather',
            'context.integration?.requireService?.("effects")',
            'context.chamber?.getCameraSnapshot',
            'context.views?.getReadingZone',
            'context.views?.getControlZones',
            '"electrical-disturbance"',
            '"light-flash"',
            'animationLoop: "shared-runtime"'
          ]) {
            if (!source.includes(token)) throw new Error(`Weather publication is missing ${token}.`);
          }
          for (const forbidden of [
            'requestAnimationFrame',
            'setInterval',
            'Math.random',
            'querySelector',
            'window.NCNEffects',
            'dispatchEvent'
          ]) {
            if (source.includes(forbidden)) throw new Error(`Weather publication contains forbidden token ${forbidden}.`);
          }
          if (css.includes('.ncn-environment-layer')) {
            throw new Error('Weather CSS attempts to own host-layer geometry.');
          }
          for (const layer of ['weather:far', 'weather:rear', 'weather:middle', 'weather:near']) {
            if (!manifest.includes(`"${layer}"`)) throw new Error(`Manifest is missing ${layer}.`);
          }
          console.log('Weather publication respects the PR-86 scoped ownership boundary.');
          NODE

      - name: Upload scoped Weather source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-source-snapshot
          path: departments/weather/
          if-no-files-found: error
          retention-days: 1
