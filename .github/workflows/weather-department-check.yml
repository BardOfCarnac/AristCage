name: Weather Department Checks

on:
  pull_request:
    paths:
      - "departments/weather/**"
      - ".github/workflows/weather-department-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-scoped-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply Weather-owned depth-frame update
        run: |
          set -euo pipefail
          if [ ! -f departments/weather/apply-depth-frame-update.py ]; then
            echo "Scoped payload already applied."
            exit 0
          fi
          python departments/weather/apply-depth-frame-update.py
          node --check departments/weather/weather-manifest.js
          node --check departments/weather/weather-module.js
          node --check departments/weather/tests/weather-module.node.test.js
          node --check departments/weather/tests/weather-module.test.js
          node --check departments/weather/tests/weather-pr86-host.test.js
          node --check departments/weather/tests/weather-mist-visual-contract.test.js
          node departments/weather/tests/weather-module.node.test.js
          node departments/weather/tests/weather-mist-visual-contract.test.js

      - name: Commit Weather-owned publication update
        run: |
          set -euo pipefail
          if git diff --quiet -- departments/weather; then
            echo "No scoped Weather update remains to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add departments/weather
          git commit -m "Expose immutable Weather puff-depth frames"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
