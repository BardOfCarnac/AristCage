name: Browser Department Installation

on:
  pull_request:
    paths:
      - "index.html"
      - "js/integration-browser-probe.js"
      - "js/integration-service-gate.js"
      - "js/integration-departments.js"
      - "js/integration-services.js"
      - "js/module-manager.js"
      - "js/department-context.js"
      - "js/viewer-host.js"
      - "js/departments/effects/**"
      - "departments/weather/**"
      - "departments/chamber-movement/**"
      - ".github/workflows/browser-department-installation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-in-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check probe syntax
        run: node --check js/integration-browser-probe.js

      - name: Start static viewer
        run: |
          python3 -m http.server 4173 > /tmp/ncn-server.log 2>&1 &
          echo $! > /tmp/ncn-server.pid
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/ncn-server.log
          exit 1

      - name: Install accepted departments in Chromium
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "No Chromium-compatible browser is available on the runner."
            exit 1
          fi

          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=12000 \
            --dump-dom \
            "http://127.0.0.1:4173/index.html?integrationProbe=1" \
            > /tmp/ncn-browser-probe.html

          grep -o 'data-integration-probe-status="[^"]*"' /tmp/ncn-browser-probe.html || true
          if ! grep -q 'data-integration-probe-status="ready"' /tmp/ncn-browser-probe.html; then
            echo "Accepted departments failed to install in the real browser page."
            sed -n '/id="integration-browser-probe"/,/<\/pre>/p' /tmp/ncn-browser-probe.html
            exit 1
          fi

      - name: Stop static viewer
        if: always()
        run: |
          if [ -f /tmp/ncn-server.pid ]; then
            kill "$(cat /tmp/ncn-server.pid)" || true
          fi
