          Path('tests/article-mist-descent-contract.test.js').write_text(r'''const fs = require("fs");
const assert = require("assert");

const optical = fs.readFileSync("js/optical-projection.js", "utf8");
const adapter = fs.readFileSync("js/optical-adapter.js", "utf8");
const integration = fs.readFileSync("js/article-mist-descent.js", "utf8");
const weather = fs.readFileSync("departments/weather/weather-module.js", "utf8");
const index = fs.readFileSync("index.html", "utf8");

for (const token of [
  "createDescentSession(record)",
  "optical-descending",
  "window.NCNOptical?.beginDescent?.(session)",
  "--optical-descent-y",
  "chamberZ"
]) assert.ok(optical.includes(token), `Optical descent contract is missing ${token}`);

assert.ok(adapter.includes("function beginDescent(session)"));
assert.ok(adapter.includes("window.NCNArticleMistDescent?.begin?.(session)"));

for (const token of [
  'runtime.register(TASK_NAME, step',
  'group: "article"',
  'priority: 5',
  'service.getDepthFrame(frame?.frame)',
  'depthFrame.renderForeground',
  'privateAnimationLoop: false'
]) assert.ok(integration.includes(token), `Integration compositor is missing ${token}`);

for (const forbidden of ["html2canvas", "toDataURL", "createImageBitmap", "drawImage(article", "requestAnimationFrame(step)"])
  assert.equal(integration.includes(forbidden), false, `Integration must not rasterise the article or own a private loop: ${forbidden}`);

assert.ok(weather.includes("frame?.frame ?? frame?.id"), "Weather must recognise the production shared-runtime frame token");
assert.ok(weather.includes("puff.z < nearerThan"), "Weather must retain exact puff-depth ordering");
assert.ok(index.indexOf("departments/weather/weather-module.js") < index.indexOf("js/article-mist-descent.js"));
assert.ok(index.indexOf("js/optical-adapter.js") < index.indexOf("js/article-mist-descent.js"));

console.log("Article descent uses live Optical surfaces and the persistent Weather field through the shared runtime.");
''')

