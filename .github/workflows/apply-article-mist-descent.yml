name: Apply Article Mist Descent

on:
  push:
    branches:
      - agent/article-mist-descent

permissions:
  contents: write

jobs:
  apply-integration:
    if: ${{ !contains(github.event.head_commit.message, '[article-mist-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/article-mist-descent
          fetch-depth: 0

      - name: Apply Optical and integration changes
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Missing anchor for {label}: {path}')
              file.write_text(text.replace(old, new, 1))

          optical = Path('js/optical-projection.js')
          text = optical.read_text()
          text = text.replace(
              '  const DISMISS_DURATION = 190;\n  const BODY_DISMISS_DURATION = 180;',
              '  const DISMISS_DURATION = 190;\n  const DESCENT_DURATION = 760;\n  const REDUCED_DESCENT_DURATION = 300;\n  const DESCENT_DEPTH = 6.6;\n  const REDUCED_DESCENT_DEPTH = 4.4;\n  const BODY_DISMISS_DURATION = 180;',
              1
          )
          text = text.replace(
              '    "optical-present",\n    "optical-dismissing"',
              '    "optical-present",\n    "optical-dismissing",\n    "optical-descending"',
              1
          )
          text = text.replace(
              '      collapseTimer: 0,\n      removed: false',
              '      collapseTimer: 0,\n      descentSession: null,\n      descending: false,\n      removed: false',
              1
          )

          helper_anchor = '  function dismissRecord(record) {\n'
          if helper_anchor not in text:
              raise SystemExit('Missing dismissRecord anchor')
          helpers = r'''  function clampProgress(value) {
    return Math.max(0, Math.min(1, Number(value) || 0));
  }

  function easeDescent(value) {
    const progress = clampProgress(value);
    return 1 - Math.pow(1 - progress, 3);
  }

  function recordBounds(record) {
    const rects = [...(record?.items?.values?.() || [])]
      .map(item => item.element?.getBoundingClientRect?.())
      .filter(validRect);
    if (!rects.length) return null;
    const left = Math.min(...rects.map(rect => rect.left));
    const top = Math.min(...rects.map(rect => rect.top));
    const right = Math.max(...rects.map(rect => rect.right));
    const bottom = Math.max(...rects.map(rect => rect.bottom));
    return Object.freeze({ left, top, right, bottom, width: right - left, height: bottom - top });
  }

  function removeRecord(record, reason = "optical-dismissed") {
    if (!record) return false;
    clearTimer(record, "removalTimer");
    record.items.forEach(item => item.element.remove());
    record.items.clear();
    record.descentSession = null;
    record.descending = false;
    records.delete(record.id);
    window.NCNEvents?.emit?.("optical:descent-complete", { reason });
    return true;
  }

  function createDescentSession(record) {
    const initialBounds = recordBounds(record);
    if (!initialBounds) return null;
    const runtimeReduced = window.NCNViewerRuntime?.snapshot?.().quality === "reduced";
    const mediaReduced = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches === true;
    const reduced = runtimeReduced || mediaReduced;
    const duration = reduced ? REDUCED_DESCENT_DURATION : DESCENT_DURATION;
    const depthTravel = reduced ? REDUCED_DESCENT_DEPTH : DESCENT_DEPTH;
    const camera = cameraSnapshot();
    const initialCentreX = initialBounds.left + initialBounds.width * 0.5;
    const horizontalTravel = camera
      ? (camera.centreX - initialCentreX) * (reduced ? 0.08 : 0.18)
      : 0;
    const verticalTravel = Math.min(
      window.innerHeight * (reduced ? 0.10 : 0.24),
      reduced ? 78 : 230
    );
    const scaleLoss = reduced ? 0.12 : 0.30;
    const startDepth = Math.min(...SEMANTIC_PLANES.map(definition => definition.z));
    let closed = false;

    function close(reason, cancelled) {
      if (closed) return false;
      closed = true;
      return removeRecord(record, reason || (cancelled ? "descent-cancelled" : "descent-finished"));
    }

    const session = {
      duration,
      sample(progress) {
        if (closed) return null;
        const linear = clampProgress(progress);
        const eased = easeDescent(linear);
        const translateX = horizontalTravel * eased;
        const translateY = verticalTravel * eased;
        const descentScale = 1 - scaleLoss * eased;
        record.items.forEach(item => {
          const element = item.element;
          element.style.setProperty("--optical-descent-x", `${translateX.toFixed(2)}px`);
          element.style.setProperty("--optical-descent-y", `${translateY.toFixed(2)}px`);
          element.style.setProperty("--optical-descent-scale", descentScale.toFixed(5));
        });

        const bounds = recordBounds(record);
        if (!bounds) return Object.freeze({ complete: true, surface: null });
        const chamberZ = startDepth + depthTravel * eased;
        const surface = Object.freeze({
          chamberZ,
          projectedBounds: bounds,
          clip(targetContext, viewport = {}) {
            const originX = Number(viewport.left) || 0;
            const originY = Number(viewport.top) || 0;
            const left = bounds.left - originX;
            const top = bounds.top - originY;
            targetContext.beginPath?.();
            if (typeof targetContext.roundRect === "function") {
              targetContext.roundRect(left, top, bounds.width, bounds.height, Math.min(18, bounds.height * 0.08));
            } else {
              targetContext.rect?.(left, top, bounds.width, bounds.height);
            }
            targetContext.clip?.();
          }
        });
        return Object.freeze({ progress: linear, eased, complete: linear >= 1, surface });
      },
      finish(reason = "descent-finished") { return close(reason, false); },
      cancel(reason = "descent-cancelled") { return close(reason, true); }
    };
    return Object.freeze(session);
  }

'''
          text = text.replace(helper_anchor, helpers + helper_anchor, 1)

          old_dismiss = '''  function dismissRecord(record) {
    if (!record || record.removed) return;
    record.removed = true;
    record.items.forEach(item => setOpticalLifecycle(item.element, "dismissing"));

    record.removalTimer = window.setTimeout(() => {
      record.removalTimer = 0;
      record.items.forEach(item => item.element.remove());
      records.delete(record.id);
    }, DISMISS_DURATION + 30);
  }
'''
          new_dismiss = '''  function dismissRecord(record) {
    if (!record || record.removed) return;
    record.removed = true;
    record.descending = true;
    record.items.forEach(item => {
      setOpticalLifecycle(item.element, "descending");
      item.element.style.setProperty("--optical-descent-x", "0px");
      item.element.style.setProperty("--optical-descent-y", "0px");
      item.element.style.setProperty("--optical-descent-scale", "1");
    });

    const session = createDescentSession(record);
    record.descentSession = session;
    if (session && window.NCNOptical?.beginDescent?.(session)) return;

    record.descending = false;
    record.descentSession = null;
    record.items.forEach(item => setOpticalLifecycle(item.element, "dismissing"));
    record.removalTimer = window.setTimeout(() => {
      record.removalTimer = 0;
      removeRecord(record, "fallback-dismissed");
    }, DISMISS_DURATION + 30);
  }
'''
          if old_dismiss not in text:
              raise SystemExit('Existing dismissRecord block did not match')
          text = text.replace(old_dismiss, new_dismiss, 1)

          old_restore = '''      if (record.removed) {
        clearTimer(record, "removalTimer");
        record.removed = false;
      }
'''
          new_restore = '''      if (record.removed) {
        record.descentSession?.cancel?.("source-restored");
        createRecord(source, index, camera, animateNew);
        return;
      }
'''
          if old_restore not in text:
              raise SystemExit('Existing removed-record restoration block did not match')
          text = text.replace(old_restore, new_restore, 1)

          old_disable = '''    records.forEach(record => {
      clearTimer(record, "lifecycleTimer");
      clearTimer(record, "removalTimer");
      clearTimer(record, "collapseTimer");
    });
'''
          new_disable = '''    [...records.values()].forEach(record => record.descentSession?.cancel?.("optical-disabled"));
    records.forEach(record => {
      clearTimer(record, "lifecycleTimer");
      clearTimer(record, "removalTimer");
      clearTimer(record, "collapseTimer");
    });
'''
          if old_disable not in text:
              raise SystemExit('Existing disable cleanup block did not match')
          text = text.replace(old_disable, new_disable, 1)
          optical.write_text(text)

          adapter = Path('js/optical-adapter.js')
          text = adapter.read_text()
          suspend_anchor = '  function suspend() {\n'
          if suspend_anchor not in text:
              raise SystemExit('Missing Optical adapter suspend anchor')
          begin_method = '''  function beginDescent(session) {
    if (!session || typeof session.sample !== "function"
      || typeof session.finish !== "function" || typeof session.cancel !== "function") return false;
    return Boolean(window.NCNArticleMistDescent?.begin?.(session));
  }

'''
          text = text.replace(suspend_anchor, begin_method + suspend_anchor, 1)
          text = text.replace(
              '    getCameraSnapshot: () => renderer()?.getCameraSnapshot?.() || null,\n    suspend,',
              '    getCameraSnapshot: () => renderer()?.getCameraSnapshot?.() || null,\n    beginDescent,\n    suspend,',
              1
          )
          adapter.write_text(text)

          optical_css = Path('css/optical-projection.css')
          text = optical_css.read_text()
          text = text.replace(
              '  transform: scale(var(--optical-item-scale, 1));',
              '  transform: translate(var(--optical-descent-x, 0px), var(--optical-descent-y, 0px))\n    scale(var(--optical-item-scale, 1)) scale(var(--optical-descent-scale, 1));',
              1
          )
          descending_rule = '''
.optical-mode .optical-semantic-item.optical-descending {
  opacity: 1;
  filter: none;
  animation: none !important;
  will-change: transform;
}
'''
          marker = '.optical-mode .optical-semantic-item.optical-dismissing {\n'
          if marker not in text:
              raise SystemExit('Missing optical dismissing CSS marker')
          text = text.replace(marker, descending_rule + '\n' + marker, 1)
          optical_css.write_text(text)

          Path('css/article-mist-descent.css').write_text(r'''/* Integration-owned transient foreground pass for live Optical descent. */
.ncn-article-mist-compositor {
  position: fixed;
  inset: 0;
  z-index: 16;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  background: transparent;
  contain: strict;
}

html[data-ncn-app="dripfeed"] .ncn-article-mist-compositor,
body[data-ncn-app="dripfeed"] .ncn-article-mist-compositor {
  display: none !important;
}
''')

          Path('js/article-mist-descent.js').write_text(r'''/*==================================================
  ARTICLE DESCENT THROUGH THE PERSISTENT MIST FIELD

  Integration coordinates an opaque Optical descent session with Weather's
  immutable current depth frame. It owns one transient canvas and one shared-
  runtime task. It neither snapshots articles nor simulates Weather.
==================================================*/

window.NCNArticleMistDescent = (() => {
  const TASK_NAME = "article-mist-descent";
  const sessions = new Map();
  let serial = 0;
  let canvas = null;
  let context = null;
  let runtimeHandle = null;
  let width = 0;
  let height = 0;
  let pixelRatio = 1;
  let destroyed = false;

  function runtime() {
    return window.NCNViewerRuntime || null;
  }

  function weather() {
    return window.NCNIntegration?.getService?.("weather") || null;
  }

  function isRedWire() {
    return (window.NCNApplications?.current?.()
      || (typeof NCN_STATE !== "undefined" ? NCN_STATE.activeApp : "redwire")) === "redwire";
  }

  function qualityPixelRatio() {
    const reduced = runtime()?.snapshot?.().quality === "reduced";
    return reduced ? 1 : Math.min(1.5, Math.max(1, window.devicePixelRatio || 1));
  }

  function ensureCanvas() {
    if (canvas?.isConnected) return canvas;
    canvas = document.createElement("canvas");
    canvas.className = "ncn-article-mist-compositor";
    canvas.setAttribute("aria-hidden", "true");
    canvas.hidden = true;
    document.body.append(canvas);
    context = canvas.getContext("2d", { alpha: true });
    resizeCanvas(true);
    return canvas;
  }

  function resizeCanvas(force = false) {
    if (!canvas || !context) return false;
    const nextWidth = Math.max(1, Math.round(window.innerWidth));
    const nextHeight = Math.max(1, Math.round(window.innerHeight));
    const nextRatio = qualityPixelRatio();
    if (!force && nextWidth === width && nextHeight === height && nextRatio === pixelRatio) return false;
    width = nextWidth;
    height = nextHeight;
    pixelRatio = nextRatio;
    canvas.width = Math.max(1, Math.round(width * pixelRatio));
    canvas.height = Math.max(1, Math.round(height * pixelRatio));
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    return true;
  }

  function clearCanvas() {
    if (!context) return;
    context.save();
    context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    context.clearRect(0, 0, width, height);
    context.restore();
  }

  function finishEntry(id, entry, reason, cancelled = false) {
    if (!sessions.has(id)) return;
    sessions.delete(id);
    try {
      if (cancelled) entry.session.cancel(reason);
      else entry.session.finish(reason);
    } catch (error) {
      console.error("[NCN article mist descent] session cleanup failed", error);
    }
  }

  function cancelAll(reason = "article-mist-cancelled") {
    [...sessions.entries()].forEach(([id, entry]) => finishEntry(id, entry, reason, true));
    clearCanvas();
    if (canvas) canvas.hidden = true;
    runtimeHandle?.disable?.();
    return true;
  }

  function currentDepthFrame(frame) {
    const service = weather();
    if (!service?.getDepthFrame) return null;
    return service.getDepthFrame(frame?.frame) || service.getDepthFrame();
  }

  function step(frame) {
    if (destroyed || !sessions.size) return false;
    if (!isRedWire()) {
      cancelAll("application-left-redwire");
      return false;
    }

    ensureCanvas();
    resizeCanvas();
    clearCanvas();
    canvas.hidden = false;
    const depthFrame = currentDepthFrame(frame);
    const viewport = Object.freeze({ left: 0, top: 0, width, height });
    const now = Number(frame?.now) || performance.now();

    for (const [id, entry] of [...sessions.entries()]) {
      if (entry.startedAt === null) entry.startedAt = now;
      const duration = Math.max(1, Number(entry.session.duration) || 760);
      const progress = Math.max(0, Math.min(1, (now - entry.startedAt) / duration));
      let sample = null;
      try {
        sample = entry.session.sample(progress, frame);
      } catch (error) {
        console.error("[NCN article mist descent] Optical sample failed", error);
        finishEntry(id, entry, "optical-sample-error", true);
        continue;
      }

      const surface = sample?.surface || null;
      if (surface && depthFrame && Number.isFinite(Number(surface.chamberZ))) {
        context.save();
        try {
          if (typeof surface.clip === "function") surface.clip(context, viewport);
          else if (surface.projectedBounds) {
            const bounds = surface.projectedBounds;
            context.beginPath();
            context.rect(bounds.left, bounds.top, bounds.width, bounds.height);
            context.clip();
          }
          depthFrame.renderForeground(context, {
            nearerThan: Number(surface.chamberZ),
            viewport
          });
        } finally {
          context.restore();
        }
      }

      if (sample?.complete || progress >= 1) finishEntry(id, entry, "article-submerged", false);
    }

    if (!sessions.size) {
      clearCanvas();
      canvas.hidden = true;
      return false;
    }
    return true;
  }

  function ensureRuntimeTask() {
    if (runtimeHandle) return runtimeHandle;
    const sharedRuntime = runtime();
    if (!sharedRuntime?.register) return null;
    runtimeHandle = sharedRuntime.register(TASK_NAME, step, {
      group: "article",
      priority: 5,
      maxFps: 30,
      enabled: false,
      wake: false
    });
    return runtimeHandle;
  }

  function begin(session) {
    if (destroyed || !isRedWire() || !session || typeof session.sample !== "function") return false;
    const task = ensureRuntimeTask();
    if (!task) return false;
    ensureCanvas();
    const id = ++serial;
    sessions.set(id, { session, startedAt: null });
    canvas.hidden = false;
    task.enable?.("article-mist-descent-start");
    task.wake?.("article-mist-descent-start");
    return true;
  }

  function destroy(reason = "article-mist-destroy") {
    if (destroyed) return false;
    cancelAll(reason);
    runtimeHandle?.unregister?.();
    runtimeHandle = null;
    canvas?.remove?.();
    canvas = null;
    context = null;
    destroyed = true;
    return true;
  }

  window.addEventListener("resize", () => resizeCanvas(true), { passive: true });
  window.addEventListener("ncn:application-change", event => {
    if (event.detail?.name !== "redwire") cancelAll("application-change");
  });

  return Object.freeze({
    begin,
    cancelAll,
    destroy,
    snapshot: () => Object.freeze({
      active: sessions.size,
      canvas: Boolean(canvas?.isConnected),
      canvasVisible: Boolean(canvas && !canvas.hidden),
      runtimeTask: Boolean(runtimeHandle),
      pixelRatio,
      privateAnimationLoop: false,
      weatherSimulation: "read-only-current-depth-frame"
    })
  });
})();
''')

          index = Path('index.html')
          text = index.read_text()
          css_anchor = '  <link rel="stylesheet" href="css/optical-three-plane-profile.css?v=priority-clear-1" data-optional-module="optical-projection" />\n'
