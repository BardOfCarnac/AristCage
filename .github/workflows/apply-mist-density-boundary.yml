name: Apply Mist Density And Chamber Boundary

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: apply-mist-density-boundary
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/agent/article-mist-descent') || (github.event_name == 'pull_request' && github.head_ref == 'agent/article-mist-descent') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/article-mist-descent
      - id: ready
        name: Check for patch
        run: |
          if [ -f scripts/apply-mist-density-boundary.cjs ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Align patcher with current Weather contract
        if: steps.ready.outputs.ready == 'true'
        run: node scripts/fix-mist-density-patcher.cjs
      - name: Apply denser fields and chamber clipping
        if: steps.ready.outputs.ready == 'true'
        run: node scripts/apply-mist-density-boundary.cjs
      - name: Validate corrected publication
        if: steps.ready.outputs.ready == 'true'
        run: |
          node --check departments/weather/weather-module.js
          node --check departments/weather/weather-presets.js
          node --check tests/weather-density-boundary.browser.js
          node departments/weather/tests/weather-module.node.test.js
          node departments/weather/tests/weather-mist-visual-contract.test.js
      - name: Remove one-shot patch files
        if: steps.ready.outputs.ready == 'true'
        run: rm scripts/apply-mist-density-boundary.cjs scripts/fix-mist-density-patcher.cjs .github/workflows/apply-mist-density-boundary.yml
      - name: Commit corrected implementation
        if: steps.ready.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add departments/weather/weather-presets.js departments/weather/weather-module.js departments/weather/tests/weather-module.node.test.js departments/weather/tests/weather-mist-visual-contract.test.js tests/weather-density-boundary.browser.js .github/workflows/article-mist-descent.yml scripts/apply-mist-density-boundary.cjs scripts/fix-mist-density-patcher.cjs .github/workflows/apply-mist-density-boundary.yml
          git commit -m "Densify mist and clip it to the chamber [mist-density-boundary-applied]"
          git push origin HEAD:agent/article-mist-descent
