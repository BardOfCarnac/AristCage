name: Integration Host Checks

on:
  pull_request:
    paths:
      - "index.html"
      - "js/**"
      - "css/diagnostics.css"
      - "departments/weather/**"
      - "tests/dev-panel-browser.mjs"
      - "tools/apply-pr120-review-contract.py"
      - ".github/workflows/integration-host-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-review-contract:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/persistent-weather-and-mist-recycling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/persistent-weather-and-mist-recycling
          fetch-depth: 0

      - name: Apply review contract fixes
        run: python3 tools/apply-pr120-review-contract.py

      - name: Verify corrected sources
        run: |
          set -euo pipefail
          node --check js/diagnostics.js
          node --check departments/weather/weather-module.js
          node --check departments/weather/tests/weather-module.node.test.js
          node --check tests/dev-panel-browser.mjs
          node departments/weather/tests/weather-module.node.test.js

      - name: Commit tested fix
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes remain to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/diagnostics.js css/diagnostics.css departments/weather/weather-module.js departments/weather/tests/weather-module.node.test.js tests/dev-panel-browser.mjs index.html
          git commit -m "Close PR 120 integration contract gaps"
          git push origin HEAD:agent/persistent-weather-and-mist-recycling
