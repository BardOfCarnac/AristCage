name: Integration Host Checks

on:
  pull_request:
    paths:
      - "index.html"
      - "js/**"
      - "departments/weather/**"
      - "departments/chamber-movement/**"
      - "tests/effects-department-node.js"
      - "tests/environment-profile-contract.test.js"
      - "css/environment-system.css"
      - "css/chamber-motion-adapter.css"
      - "docs/INTEGRATION-HOST.md"
      - "docs/MODULE-INTAKE-TEMPLATES.md"
      - "docs/EFFECTS-DEPARTMENT-PUBLICATION.md"
      - ".github/workflows/integration-host-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-load-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check integration JavaScript syntax
        run: |
          set -euo pipefail
          files=(
            js/viewer-runtime.js
            js/viewer-lifecycle.js
            js/event-bus.js
            js/integration-contract.js
            js/scene-registry.js
            js/module-manager.js
            js/visual-director.js
            js/module-intake.js
            js/department-context.js
            js/optical-adapter.js
            js/environment-host.js
            js/chamber-motion-adapter.js
            js/dripfeed-adapter.js
            js/environment-manager.js
            js/viewer-host.js
            js/integration-services.js
            js/integration-departments.js
            js/integration-harness.js
            js/departments/effects/effects-manifest.js
            js/departments/effects/effects-public-names.js
            js/departments/effects/effects-catalogue-signal.js
            js/departments/effects/effects-catalogue-fault.js
            js/departments/effects/effects-catalogue-environment.js
            js/departments/effects/effects-module.js
            departments/weather/weather-manifest.js
            departments/weather/weather-presets.js
            departments/weather/weather-module.js
            departments/weather/tests/weather-module.node.test.js
            departments/weather/tests/weather-module.test.js
            departments/weather/tests/weather-pr86-host.test.js
            departments/chamber-movement/block-rearrangement.js
            departments/chamber-movement/publication.js
            departments/chamber-movement/tests/acceptance.js
            departments/chamber-movement/tests/publication-contract.js
            departments/chamber-movement/tests/source-integrity.js
            tests/effects-department-node.js
            tests/environment-profile-contract.test.js
          )
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Run Effects Department deterministic cleanup harness
        run: node tests/effects-department-node.js

      - name: Run Weather Department deterministic acceptance harness
        run: node departments/weather/tests/weather-module.node.test.js

      - name: Run RedWire environment profile contract
        run: node tests/environment-profile-contract.test.js

      - name: Run Chamber Movement deterministic acceptance harness
        run: |
          node departments/chamber-movement/tests/source-integrity.js
          node departments/chamber-movement/tests/acceptance.js
          node departments/chamber-movement/tests/publication-contract.js

      - name: Check script references exist and are unique
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const sources = [...html.matchAll(/<script\s+src="([^"]+)"/g)]
            .map(match => match[1].split('?')[0]);
          const missing = sources.filter(source => !fs.existsSync(source));
          const duplicates = sources.filter((source, index) => sources.indexOf(source) !== index);
          if (missing.length) throw new Error(`Missing script files: ${[...new Set(missing)].join(', ')}`);
          if (duplicates.length) throw new Error(`Duplicate script references: ${[...new Set(duplicates)].join(', ')}`);
          console.log(`Checked ${sources.length} script references.`);
          NODE

      - name: Check integration load order
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const sources = [...html.matchAll(/<script\s+src="([^"]+)"/g)]
            .map(match => match[1].split('?')[0]);
          const requiredOrder = [
            'js/viewer-runtime.js',
            'js/viewer-lifecycle.js',
            'js/event-bus.js',
            'js/integration-contract.js',
            'js/scene-registry.js',
            'js/module-manager.js',
            'js/visual-director.js',
            'js/module-intake.js',
            'js/department-context.js',
            'js/departments/effects/effects-manifest.js',
            'js/departments/effects/effects-public-names.js',
            'js/departments/effects/effects-catalogue-signal.js',
            'js/departments/effects/effects-catalogue-fault.js',
            'js/departments/effects/effects-catalogue-environment.js',
            'js/departments/effects/effects-module.js',
            'departments/weather/weather-manifest.js',
            'departments/weather/weather-presets.js',
            'departments/weather/weather-module.js',
            'departments/chamber-movement/block-rearrangement.js',
            'departments/chamber-movement/publication.js',
            'js/optical-adapter.js',
            'js/environment-host.js',
            'js/chamber-motion-adapter.js',
            'js/application-switcher.js',
            'js/dripfeed-adapter.js',
            'js/environment-manager.js',
            'js/viewer-host.js',
            'js/integration-services.js',
            'js/integration-departments.js',
            'js/integration-harness.js'
          ];
          let previous = -1;
          for (const source of requiredOrder) {
            const index = sources.indexOf(source);
            if (index < 0) throw new Error(`Required integration script is not loaded: ${source}`);
            if (index <= previous) throw new Error(`Integration script is out of order: ${source}`);
            previous = index;
          }
          console.log('Integration load order is valid.');
          NODE

      - name: Check accepted Effects, Weather and Chamber Movement staged wiring
        run: |
          node <<'NODE'
          const fs = require('fs');
          const installer = fs.readFileSync('js/integration-departments.js', 'utf8');
          const harness = fs.readFileSync('js/integration-harness.js', 'utf8');
          const adapter = fs.readFileSync('js/chamber-motion-adapter.js', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');

          for (const token of [
            'createNCNEffectsDepartment',
            'NCNEffectsDepartmentManifest',
            'retireLegacyEffects',
            'createNCNWeatherDepartment',
            'NCNWeatherDepartmentManifest',
            'retireLegacyWeather',
            'NCNChamberMotionPublication',
            'NCNChamberMotionAdapter',
            'retireLegacyChamberMotion',
            'activateChamberMotion',
            'intake.install',
            'integration:department-installed'
          ]) {
            if (!installer.includes(token)) throw new Error(`Accepted department installer is missing ${token}.`);
          }

          for (const token of [
            'production-chamber-motion-adapter',
            'getBlocks',
            'subscribeGeometryChange',
            'createPublicationInstance',
            'ncn:panel-change',
            'motionTest'
          ]) {
            if (!adapter.includes(token) && !installer.includes(token)) {
              throw new Error(`Chamber Movement integration is missing ${token}.`);
            }
          }

          for (const token of [
            'legacy Effects responder retired',
            'Effects profile follows',
            'Weather Department installed',
            'legacy Weather renderer retired',
            'Weather profile follows',
            'leaves Weather fully clear',
            'Chamber Movement Department installed',
            'legacy Chamber Movement responder retired',
            'Chamber Movement profile follows',
            'leaves Chamber Movement fully clear'
          ]) {
            if (!harness.includes(token)) throw new Error(`Browser harness is missing ${token}.`);
          }

          for (const source of [
            'departments/weather/weather-module.css',
            'departments/weather/weather-manifest.js',
            'departments/weather/weather-presets.js',
            'departments/weather/weather-module.js',
            'departments/chamber-movement/block-rearrangement.js',
            'departments/chamber-movement/publication.js',
            'css/chamber-motion-adapter.css',
            'js/chamber-motion-adapter.js',
            'js/integration-departments.js'
          ]) {
            if (!html.includes(source)) throw new Error(`index.html does not load ${source}.`);
          }

          const effectsStart = installer.indexOf('name: "effects"');
          const weatherStart = installer.indexOf('name: "weather"');
          const motionStart = installer.indexOf('name: "chamber-motion"');
          if (effectsStart < 0 || weatherStart <= effectsStart || motionStart <= weatherStart) {
            throw new Error('Accepted departments must install Effects → Weather → Chamber Movement.');
          }
          console.log('Accepted Effects, Weather and Chamber Movement publications are wired through staged intake.');
          NODE

      - name: Check protected integration slots
        run: |
          node <<'NODE'
          const fs = require('fs');
          const contract = fs.readFileSync('js/integration-contract.js', 'utf8');
          const intake = fs.readFileSync('js/module-intake.js', 'utf8');
          const services = fs.readFileSync('js/integration-services.js', 'utf8');
          const context = fs.readFileSync('js/department-context.js', 'utf8');
          for (const name of ['visual-director', 'optical', 'dripfeed']) {
            if (!contract.includes(`"${name}"`)) throw new Error(`Protected module is absent from contract: ${name}`);
          }
          if (!intake.includes('Protected module slots cannot be installed')) {
            throw new Error('Module intake does not enforce protected slots.');
          }
          if (!services.includes('Protected module slot cannot be installed')) {
            throw new Error('Integration installer does not enforce protected slots.');
          }
          if (!context.includes('Capability-scoped façade')) {
            throw new Error('Capability-scoped department context is absent.');
          }
          console.log('Protected integration slot and department-context guards are present.');
          NODE
