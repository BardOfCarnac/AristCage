name: Integration Host Checks

on:
  pull_request:
    paths:
      - ".github/workflows/integration-host-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-diagnostics-race-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/weather-dev-panel-overhaul'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weather-dev-panel-overhaul
          fetch-depth: 0

      - name: Apply source and regression-test patch
        run: python3 tools/apply-diagnostics-dispatch-race-fix.py

      - name: Verify deterministic delayed-readiness cleanup
        run: |
          node --check js/dev-panel-controls.js
          node --check tests/dev-panel-controls.test.js
          node tests/dev-panel-controls.test.js

      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/dev-panel-controls.js tests/dev-panel-controls.test.js
          git commit -m "Fix diagnostics dispatch shutdown race"
          git push origin HEAD:agent/weather-dev-panel-overhaul
