name: Integration Host Checks

on:
  pull_request:
    paths:
      - ".github/workflows/integration-host-check.yml"
      - "tools/apply-persistent-weather-and-mist-recycling.py"
      - "tools/remove-obsolete-mist-respawn.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-weather-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/persistent-weather-and-mist-recycling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/persistent-weather-and-mist-recycling
          fetch-depth: 0

      - name: Apply source and regression-test patch
        run: |
          python3 tools/apply-persistent-weather-and-mist-recycling.py
          python3 tools/remove-obsolete-mist-respawn.py

      - name: Verify deterministic Weather and diagnostics sources
        run: |
          node --check js/diagnostics.js
          node --check departments/weather/weather-module.js
          node --check departments/weather/tests/weather-module.node.test.js
          node --check tests/dev-panel-browser.mjs
          node departments/weather/tests/weather-module.node.test.js

      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            index.html \
            js/diagnostics.js \
            css/diagnostics.css \
            departments/weather/weather-module.js \
            departments/weather/tests/weather-module.node.test.js \
            tests/dev-panel-browser.mjs
          git commit -m "Keep Weather previews visible and sustain mist"
          git push origin HEAD:agent/persistent-weather-and-mist-recycling
