name: Synchronize PR 129 With Main

on:
  push:
    branches:
      - agent/remove-weather-reading-suppression

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-weather-reading-suppression
          fetch-depth: 0

      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:agent/remove-weather-reading-suppression
