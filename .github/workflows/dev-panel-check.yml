name: Developer Panel Checks

on:
  pull_request:
    paths:
      - "index.html"
      - "js/diagnostics.js"
      - "js/dev-panel-controls.js"
      - "js/integration-service-gate.js"
      - "css/dev-panel-controls.css"
      - "tests/dev-panel-controls.test.js"
      - "tests/dev-panel-browser.mjs"
      - "tests/integration-service-gate.test.js"
      - ".github/workflows/dev-panel-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-dispatch-race-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/weather-dev-panel-overhaul'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weather-dev-panel-overhaul
          fetch-depth: 0

      - name: Patch tracked diagnostic dispatch cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              if new in text:
                  return False
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1))
              return True

          panel = Path("js/dev-panel-controls.js")
          replace_once(
              panel,
              '  let departmentReadyAttempt = null;\n  let telemetryTask = null;',
              '  let departmentReadyAttempt = null;\n  let pendingDiagnosticDispatches = new Set();\n  let telemetryTask = null;'
          )

          replace_once(
              panel,
              '''  async function dispatchControl(type, value) {
    if (type === "weather") return applyWeather(value, { usePresetDefaults: true });
    if (type === "weather-action") {
      if (value === "apply") return applyWeatherSettings();
      if (value === "reseed") return replayWeatherSeed();
      if (value === "copy") return copyWeatherReport();
      if (value === "show-all") return showAllWeatherLayers();
    }
    if (type === "weather-layer") return toggleWeatherLayer(value);
    if (type === "motion") return triggerMotion(value);
    if (type === "application") return switchApplication(value);
    if (type === "profile") return restoreApplicationProfile();
    throw new RangeError(`Unknown developer control: ${type}${value ? `:${value}` : ""}`);
  }
''',
              '''  async function executeControl(type, value) {
    if (type === "weather") return applyWeather(value, { usePresetDefaults: true });
    if (type === "weather-action") {
      if (value === "apply") return applyWeatherSettings();
      if (value === "reseed") return replayWeatherSeed();
      if (value === "copy") return copyWeatherReport();
      if (value === "show-all") return showAllWeatherLayers();
    }
    if (type === "weather-layer") return toggleWeatherLayer(value);
    if (type === "motion") return triggerMotion(value);
    if (type === "application") return switchApplication(value);
    if (type === "profile") return restoreApplicationProfile();
    throw new RangeError(`Unknown developer control: ${type}${value ? `:${value}` : ""}`);
  }

  async function dispatchControl(type, value) {
    if (!diagnosticsActive) {
      recordAction("control", `${type}:${value || ""}`, "ignored", "diagnostics-inactive");
      return null;
    }

    const operation = Promise.resolve().then(() => executeControl(type, value));
    pendingDiagnosticDispatches.add(operation);
    try {
      return await operation;
    } finally {
      pendingDiagnosticDispatches.delete(operation);
    }
  }

  async function settleDiagnosticDispatches() {
    while (pendingDiagnosticDispatches.size) {
      await Promise.allSettled([...pendingDiagnosticDispatches]);
    }
    return true;
  }
'''
          )

          replace_once(
              panel,
              '''    if (wasActive) {
      await restoreApplicationProfile({ quiet: true, reason: "diagnostics-disabled" });
    } else {
      overrideActive = false;
    }
''',
              '''    if (wasActive) {
      await settleDiagnosticDispatches();
      await restoreApplicationProfile({ quiet: true, reason: "diagnostics-disabled" });
    } else {
      overrideActive = false;
    }
'''
          )

          replace_once(
              panel,
              '      eventSubscriptionCount: diagnosticUnsubscribers.length,\n      environmentPreview:',
              '      eventSubscriptionCount: diagnosticUnsubscribers.length,\n      pendingDispatchCount: pendingDiagnosticDispatches.size,\n      environmentPreview:'
          )

          test = Path("tests/dev-panel-controls.test.js")
          replace_once(
              test,
              'global.NCNIntegratedDepartments = { ready: async () => { throw new Error("Live services should avoid stale readiness waits."); } };',
              'let departmentReadyHandler = async () => { throw new Error("Live services should avoid stale readiness waits."); };\nglobal.NCNIntegratedDepartments = { ready: () => departmentReadyHandler() };'
          )

          replace_once(
              test,
              '''  assert.equal(motionListeners.size, 0, "diagnostic movement listeners must be released");

  console.log("Developer panel lifecycle harness passed.");
''',
              '''  assert.equal(motionListeners.size, 0, "diagnostic movement listeners must be released");

  diagnosticsOn = true;
  await global.NCNDevPanel.setDiagnosticsActive(true);
  const restoreCountBeforeRace = profileRestoreCount;
  let releaseDepartments;
  departmentReadyHandler = () => new Promise(resolve => { releaseDepartments = resolve; });
  services.delete("weather");
  services.delete("chamber-motion");

  const delayedWeather = global.NCNDevPanel.dispatchControl("weather", "heavy");
  const delayedMotion = global.NCNDevPanel.dispatchControl("motion", "large");
  await Promise.resolve();
  assert.equal(global.NCNDevPanel.snapshot().pendingDispatchCount, 2,
    "delayed laboratory actions must be visible as pending dispatches");

  diagnosticsOn = false;
  const delayedDisable = global.NCNDevPanel.setDiagnosticsActive(false);
  await Promise.resolve();
  assert.equal(profileRestoreCount, restoreCountBeforeRace,
    "diagnostics-off must not restore ahead of pending laboratory actions");

  services.set("weather", weather);
  services.set("chamber-motion", motion);
  releaseDepartments();
  await Promise.all([delayedWeather, delayedMotion, delayedDisable]);

  const raceCleaned = global.NCNDevPanel.snapshot();
  assert.equal(profileRestoreCount, restoreCountBeforeRace + 1,
    "diagnostics-off must perform one final canonical restore after pending actions settle");
  assert.equal(raceCleaned.pendingDispatchCount, 0, "all delayed laboratory dispatches must be drained");
  assert.equal(raceCleaned.weather.targetPreset, "mist",
    "a delayed Weather request must not overwrite the final RedWire profile");
  assert.equal(raceCleaned.weather.targetIntensity, 0.46,
    "a delayed Weather request must not retain laboratory intensity");
  assert.equal(raceCleaned.chamberMotion.activeSequenceCount, 0,
    "a delayed motion request must be cancelled by the final profile restore");
  assert.equal(raceCleaned.overrideActive, false,
    "the delayed-action round trip must leave no active developer override");
  assert.equal(documentElement.dataset.devEnvironmentPreview, undefined,
    "the delayed-action round trip must leave no preview lift");

  console.log("Developer panel lifecycle and delayed-dispatch cleanup harness passed.");
'''
          )
          PY

      - name: Verify patch
        run: |
          node --check js/dev-panel-controls.js
          node --check tests/dev-panel-controls.test.js
          node tests/dev-panel-controls.test.js

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "Diagnostics race fix already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/dev-panel-controls.js tests/dev-panel-controls.test.js
          git commit -m "Fix diagnostics dispatch shutdown race"
          git push origin HEAD:agent/weather-dev-panel-overhaul

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check developer control syntax
        run: |
          node --check js/diagnostics.js
          node --check js/dev-panel-controls.js
          node --check js/integration-service-gate.js
          node --check tests/dev-panel-controls.test.js
          node --check tests/dev-panel-browser.mjs
          node --check tests/integration-service-gate.test.js

      - name: Run service capability gate harness
        run: node tests/integration-service-gate.test.js

      - name: Run developer control lifecycle harness
        run: node tests/dev-panel-controls.test.js

      - name: Check shared launcher and service wiring
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const diagnosticsScript = fs.readFileSync('js/diagnostics.js', 'utf8');
          const script = fs.readFileSync('js/dev-panel-controls.js', 'utf8');
          const gate = fs.readFileSync('js/integration-service-gate.js', 'utf8');
          const css = fs.readFileSync('css/dev-panel-controls.css', 'utf8');

          for (const source of [
            'css/dev-panel-controls.css',
            'js/integration-service-gate.js',
            'js/dev-panel-controls.js'
          ]) {
            if (!html.includes(source)) throw new Error(`index.html does not load ${source}.`);
          }

          const diagnostics = html.indexOf('js/diagnostics.js');
          const integration = html.indexOf('js/integration-departments.js');
          const capabilityGate = html.indexOf('js/integration-service-gate.js');
          const controls = html.indexOf('js/dev-panel-controls.js');
          if (
            diagnostics < 0
            || integration < diagnostics
            || capabilityGate < integration
            || controls < capabilityGate
          ) {
            throw new Error('Developer controls must load after the department installer and capability gate.');
          }

          for (const token of [
            'ensureDiagnosticsInterface',
            'data-debug-weather',
            'data-debug-motion',
            'dispatchControl',
            'resolveService',
            'syncApplicationProfile',
            'setDiagnosticsActive',
            'NCNViewerRuntime',
            'diagnostics:weather-laboratory',
            'unbindDiagnosticBindings',
            'diagnostics-disabled',
            'chamber-motion',
            'weather'
          ]) {
            if (!script.includes(token)) throw new Error(`Developer controls are missing ${token}.`);
          }

          if (script.includes('new MutationObserver')) {
            throw new Error('Developer controls must not observe the document while diagnostics are dormant.');
          }
          if (/\bsetInterval\s*\(/.test(script)) {
            throw new Error('Developer telemetry must use the shared runtime rather than a private interval.');
          }
          if (!diagnosticsScript.includes('NCNDevPanel?.setDiagnosticsActive')) {
            throw new Error('Projection Diagnostics does not coordinate the developer laboratory lifecycle.');
          }

          for (const token of [
            'REQUIRED_CAPABILITIES',
            'applyProfile',
            'trigger',
            'hasPublicService',
            '__capabilityGate'
          ]) {
            if (!gate.includes(token)) throw new Error(`Integration service gate is missing ${token}.`);
          }

          if (!css.includes('.diagnostics-toggle') || !css.includes('display: block !important')) {
            throw new Error('The application-neutral developer launcher is not visible while diagnostics are active.');
          }
          if (!css.includes('data-dev-environment-preview')) {
            throw new Error('Developer Weather and movement previews are not lifted above Dripfeed.');
          }
          console.log('Shared developer panel controls are lifecycle-gated and wired correctly.');
          NODE

  mounted-browser-proof:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.54.1 > /tmp/ncn-dev-panel-browser-install.log 2>&1
          npx playwright install --with-deps chromium >> /tmp/ncn-dev-panel-browser-install.log 2>&1

      - name: Run desktop and mobile laboratory proof
        id: browser
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p artifacts/dev-panel-browser
          python3 -m http.server 4173 > /tmp/ncn-dev-panel-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node tests/dev-panel-browser.mjs 2>&1 | tee artifacts/dev-panel-browser/test-output.log

      - name: Print browser diagnostics
        if: always()
        run: |
          echo "Mounted proof outcome: ${{ steps.browser.outcome }}"
          find artifacts/dev-panel-browser -maxdepth 1 -type f -print 2>/dev/null || true
          test ! -f artifacts/dev-panel-browser/test-output.log || cat artifacts/dev-panel-browser/test-output.log
          for failure in artifacts/dev-panel-browser/*-failure.txt; do
            test ! -e "$failure" || { echo "--- $failure"; cat "$failure"; }
          done
          echo "--- static server log"
          test ! -f /tmp/ncn-dev-panel-http.log || tail -80 /tmp/ncn-dev-panel-http.log

      - name: Upload mounted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-panel-browser-proof
          path: |
            artifacts/dev-panel-browser
            /tmp/ncn-dev-panel-http.log
            /tmp/ncn-dev-panel-browser-install.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce mounted proof result
        if: steps.browser.outcome != 'success'
        run: exit 1
