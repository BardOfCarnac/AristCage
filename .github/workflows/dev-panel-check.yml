name: Developer Panel Checks

on:
  pull_request:
    paths:
      - "index.html"
      - "js/diagnostics.js"
      - "js/dev-panel-controls.js"
      - "js/integration-service-gate.js"
      - "css/dev-panel-controls.css"
      - "css/depth-corners.css"
      - "tests/dev-panel-controls.test.js"
      - "tests/dev-panel-browser.mjs"
      - "tests/dev-panel-corner-outline-browser.mjs"
      - "tests/integration-service-gate.test.js"
      - ".github/workflows/dev-panel-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check developer control syntax
        run: |
          node --check js/diagnostics.js
          node --check js/dev-panel-controls.js
          node --check js/integration-service-gate.js
          node --check tests/dev-panel-controls.test.js
          node --check tests/dev-panel-browser.mjs
          node --check tests/dev-panel-corner-outline-browser.mjs
          node --check tests/integration-service-gate.test.js

      - name: Run service capability gate harness
        run: node tests/integration-service-gate.test.js

      - name: Run developer control lifecycle harness
        run: node tests/dev-panel-controls.test.js

      - name: Check shared launcher and service wiring
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const diagnosticsScript = fs.readFileSync('js/diagnostics.js', 'utf8');
          const script = fs.readFileSync('js/dev-panel-controls.js', 'utf8');
          const gate = fs.readFileSync('js/integration-service-gate.js', 'utf8');
          const css = fs.readFileSync('css/dev-panel-controls.css', 'utf8');
          const cornersCss = fs.readFileSync('css/depth-corners.css', 'utf8');

          for (const source of [
            'css/dev-panel-controls.css',
            'js/integration-service-gate.js',
            'js/dev-panel-controls.js'
          ]) {
            if (!html.includes(source)) throw new Error(`index.html does not load ${source}.`);
          }

          const diagnostics = html.indexOf('js/diagnostics.js');
          const integration = html.indexOf('js/integration-departments.js');
          const capabilityGate = html.indexOf('js/integration-service-gate.js');
          const controls = html.indexOf('js/dev-panel-controls.js');
          if (
            diagnostics < 0
            || integration < diagnostics
            || capabilityGate < integration
            || controls < capabilityGate
          ) {
            throw new Error('Developer controls must load after the department installer and capability gate.');
          }

          for (const token of [
            'ensureDiagnosticsInterface',
            'data-debug-weather',
            'data-debug-motion',
            'dispatchControl',
            'resolveService',
            'syncApplicationProfile',
            'setDiagnosticsActive',
            'NCNViewerRuntime',
            'diagnostics:weather-laboratory',
            'unbindDiagnosticBindings',
            'diagnostics-disabled',
            'chamber-motion',
            'weather'
          ]) {
            if (!script.includes(token)) throw new Error(`Developer controls are missing ${token}.`);
          }

          if (script.includes('new MutationObserver')) {
            throw new Error('Developer controls must not observe the document while diagnostics are dormant.');
          }
          if (/\bsetInterval\s*\(/.test(script)) {
            throw new Error('Developer telemetry must use the shared runtime rather than a private interval.');
          }
          if (!diagnosticsScript.includes('NCNDevPanel?.setDiagnosticsActive')) {
            throw new Error('Projection Diagnostics does not coordinate the developer laboratory lifecycle.');
          }

          for (const token of [
            'REQUIRED_CAPABILITIES',
            'applyProfile',
            'trigger',
            'hasPublicService',
            '__capabilityGate'
          ]) {
            if (!gate.includes(token)) throw new Error(`Integration service gate is missing ${token}.`);
          }

          if (!css.includes('.diagnostics-toggle') || !css.includes('display: block !important')) {
            throw new Error('The application-neutral developer launcher is not visible while diagnostics are active.');
          }
          if (!css.includes('data-dev-environment-preview')) {
            throw new Error('Developer Weather and movement previews are not lifted above Dripfeed.');
          }
          if (!cornersCss.includes('html.diagnostics-on:not(.diagnostics-panel-hidden) .corners')) {
            throw new Error('Corner diagnostics must disappear whenever the diagnostics panel presentation is hidden.');
          }
          console.log('Shared developer panel controls are lifecycle-gated and wired correctly.');
          NODE

  mounted-browser-proof:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.54.1 > /tmp/ncn-dev-panel-browser-install.log 2>&1
          npx playwright install --with-deps chromium >> /tmp/ncn-dev-panel-browser-install.log 2>&1

      - name: Run desktop and mobile laboratory proof
        id: browser
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p artifacts/dev-panel-browser
          python3 -m http.server 4173 > /tmp/ncn-dev-panel-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node tests/dev-panel-browser.mjs 2>&1 | tee artifacts/dev-panel-browser/test-output.log
          node tests/dev-panel-corner-outline-browser.mjs 2>&1 | tee -a artifacts/dev-panel-browser/test-output.log

      - name: Print browser diagnostics
        if: always()
        run: |
          echo "Mounted proof outcome: ${{ steps.browser.outcome }}"
          find artifacts/dev-panel-browser -maxdepth 1 -type f -print 2>/dev/null || true
          test ! -f artifacts/dev-panel-browser/test-output.log || cat artifacts/dev-panel-browser/test-output.log
          for failure in artifacts/dev-panel-browser/*-failure.txt; do
            test ! -e "$failure" || { echo "--- $failure"; cat "$failure"; }
          done
          echo "--- static server log"
          test ! -f /tmp/ncn-dev-panel-http.log || tail -80 /tmp/ncn-dev-panel-http.log

      - name: Upload mounted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-panel-browser-proof
          path: |
            artifacts/dev-panel-browser
            /tmp/ncn-dev-panel-http.log
            /tmp/ncn-dev-panel-browser-install.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce mounted proof result
        if: steps.browser.outcome != 'success'
        run: exit 1
