name: Sync Chamber Movement Publication

on:
  push:
    branches:
      - agent/sync-chamber-movement-publication

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sync-chamber-movement-publication
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify authoritative source
        run: node departments/chamber-movement/tests/source-integrity.js

      - name: Rebuild browser publication
        run: node departments/chamber-movement/build-publication.js

      - name: Commit generated publication
        run: |
          if git diff --quiet -- departments/chamber-movement/block-rearrangement.js; then
            echo "Publication already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add departments/chamber-movement/block-rearrangement.js
          git commit -m "Synchronize Chamber Movement publication"
          git push origin HEAD:agent/sync-chamber-movement-publication
