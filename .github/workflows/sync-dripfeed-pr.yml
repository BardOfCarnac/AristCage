name: One-shot Dripfeed PR sync

on:
  push:
    branches:
      - agent/dripfeed-compact-shell
    paths:
      - .github/workflows/sync-dripfeed-pr.yml

permissions:
  contents: write

jobs:
  sync-current-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dripfeed-compact-shell
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main with documented Dripfeed ownership
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          keep_dir="$(mktemp -d)"
          keep_files=(
            css/dripfeed-chamber-integration.css
            css/dripfeed-responsive-calibration.css
            css/dripfeed-surface-prep.css
            js/dripfeed-adapter.js
            js/dripfeed-app.js
            js/dripfeed-chamber-integration.js
            tests/dripfeed-chamber-integration.mjs
          )
          for file in "${keep_files[@]}"; do
            mkdir -p "$keep_dir/$(dirname "$file")"
            cp "$file" "$keep_dir/$file"
          done

          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          # The compact controls/surface and chamber geometry remain owned by
          # this PR. The approved v29 wordmark/header and all unrelated runtime,
          # Weather, diagnostics and Chamber Movement history come from main.
          for file in "${keep_files[@]}"; do
            cp "$keep_dir/$file" "$file"
          done
          git checkout origin/main -- css/dripfeed-wordmark-animation.css js/dripfeed-wordmark.js index.html

          python3 <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          replacements = {
              'css/dripfeed-surface-prep.css?v=surface-prep-1': 'css/dripfeed-surface-prep.css?v=surface-prep-3',
              'css/dripfeed-responsive-calibration.css?v=mobile-two-column-1': 'css/dripfeed-responsive-calibration.css?v=mobile-two-column-2',
              'css/dripfeed-chamber-integration.css?v=chamber-integration-2': 'css/dripfeed-chamber-integration.css?v=chamber-integration-4',
              'js/dripfeed-app.js?v=provider-picker-2': 'js/dripfeed-app.js?v=compact-controls-1',
              'js/dripfeed-chamber-integration.js?v=chamber-integration-2': 'js/dripfeed-chamber-integration.js?v=chamber-integration-4',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected current-main load entry missing: {old}')
              text = text.replace(old, new, 1)
          index.write_text(text)

          geometry = Path('js/dripfeed-chamber-integration.js')
          source = geometry.read_text()
          old = 'const LIVE_PLANE_GAP_CELLS = 0.02;'
          new = 'const LIVE_PLANE_GAP_CELLS = 0.005;'
          if old not in source:
              raise SystemExit('Expected live-plane calibration constant missing.')
          geometry.write_text(source.replace(old, new, 1))
          PY

          git rm --force .github/workflows/sync-dripfeed-pr.yml

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$unresolved" ]]; then
            echo "Unexpected unresolved merge conflicts:"
            echo "$unresolved"
            exit 1
          fi

          git add -A
          node --check js/dripfeed-adapter.js
          node --check js/dripfeed-app.js
          node --check js/dripfeed-chamber-integration.js
          node --check tests/dripfeed-chamber-integration.mjs

          if [[ $merge_status -ne 0 ]]; then
            echo "Merge conflicts were resolved through the documented owners."
          fi
          git commit -m "Merge current main and restore Dripfeed foreground"
          git push origin HEAD:agent/dripfeed-compact-shell
