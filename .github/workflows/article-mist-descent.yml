name: Apply Heavy Mist Correction

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-heavy-mist:
    if: ${{ github.head_ref == 'agent/article-mist-descent' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/article-mist-descent
      - name: Apply corrected heavy mist volume and proof
        run: |
          node scripts/fix-heavy-mist-patcher.cjs
          node scripts/apply-heavy-mist-fix.cjs
      - name: Commit corrected implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add departments/weather/weather-presets.js departments/weather/weather-module.js departments/weather/tests/weather-module.node.test.js js/article-mist-descent.js tests/article-mist-descent-contract.test.js tests/article-mist-descent.browser.js
          git commit -m "Make heavy mist fill the chamber [heavy-mist-applied]"
          git push origin HEAD:agent/article-mist-descent
