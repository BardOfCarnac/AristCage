name: Article Mist Descent

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-heavy-mist-policy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/heavy-mist-foreground-surge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/heavy-mist-foreground-surge
          fetch-depth: 0
      - name: Apply Weather-owned preset depth flow
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("departments/weather/weather-module.js")
          text = path.read_text()
          old = '        depthFlow: APPROVED_MIST.depthFlow + state.wind.z,\n'
          new = '''        depthFlow: APPROVED_MIST.depthFlow
          + (state.config.depthFlow - (Number(PRESETS.mist?.depthFlow) || 0))
          + state.wind.z,
'''
          if new not in text:
              if old not in text:
                  raise SystemExit("Missing mist depth-flow anchor")
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Validate Weather publication
        run: |
          node --check departments/weather/weather-presets.js
          node --check departments/weather/weather-module.js
          node --check tests/heavy-mist-weather-policy.test.js
          node tests/heavy-mist-weather-policy.test.js
          node departments/weather/tests/weather-module.node.test.js
      - name: Commit Weather renderer policy
        run: |
          if git diff --quiet -- departments/weather/weather-module.js; then
            echo "Weather renderer policy already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add departments/weather/weather-module.js
          git commit -m "Let Weather presets own mist depth flow"
          git push origin HEAD:agent/heavy-mist-foreground-surge

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check js/article-mist-descent.js
          node --check js/optical-descent-adapter.js
          node --check departments/weather/weather-module.js
          node --check tests/article-mist-descent-contract.test.js
          node --check tests/article-mist-descent.browser.js
          node --check tests/weather-density-boundary.browser.js
      - name: Verify ownership and runtime contract
        run: node tests/article-mist-descent-contract.test.js

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser runner
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 > /tmp/ncn-article-mist-http.log 2>&1 &
          echo $! > /tmp/ncn-article-mist-http.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ncn-article-mist-http.log
          exit 1
      - name: Run desktop and mobile rendered proof
        run: |
          node tests/weather-density-boundary.browser.js
          node tests/article-mist-descent.browser.js
      - name: Upload rendered proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-mist-descent-proof
          path: |
            artifacts/article-mist-descent
            /tmp/ncn-article-mist-http.log
          if-no-files-found: warn
