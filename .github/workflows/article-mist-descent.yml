name: Apply Heavy Mist Test Corrections

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-heavy-mist-test-fix:
    if: ${{ github.head_ref == 'agent/article-mist-descent' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/article-mist-descent
      - name: Apply corrected test ordering and diagnostics
        run: node scripts/fix-heavy-mist-tests.cjs
      - name: Commit corrected tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add departments/weather/tests/weather-module.node.test.js tests/article-mist-descent.browser.js
          git commit -m "Correct heavy mist validation ordering"
          git push origin HEAD:agent/article-mist-descent
