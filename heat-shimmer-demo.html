<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AristCage Heat Shimmer</title><link rel="stylesheet" href="css/heat-shimmer-demo.css"></head><body><canvas id="view" aria-label="Depth-aware heat shimmer in the AristCage chamber"></canvas><section class="hud"><header><b>DEPTH HEAT SHIMMER</b><span id="status">BOOTING</span></header><p>Actual chamber projection, divided into Z buckets. Each heat sheet refracts only geometry behind it.</p><label>Intensity <input id="intensity" type="range" min="0" max="100" value="58"><output id="intensityOut">58</output></label><label>Width <input id="width" type="range" min="45" max="145" value="86"><output id="widthOut">86</output></label><label>Rise <input id="speed" type="range" min="20" max="130" value="66"><output id="speedOut">66</output></label><div class="checks"><label><input id="guides" type="checkbox" checked> heat sheets</label><label><input id="depth" type="checkbox"> Z labels</label><label><input id="pause" type="checkbox"> pause</label></div><div class="buttons"><button id="mild">Mild</button><button id="hot">Overheat</button><button id="boot">Replay boot</button></div></section><aside><b>Z 3.35</b> stays crisp · <b>Z 5.65</b> crosses one sheet · <b>Z 7.85</b> crosses two · rear grid crosses all three.</aside><script src="js/heat-shimmer-demo.js"></script></body></html>
